# Лэндинг «Падачи» — статика, отдаётся напрямую nginx.
# Живёт рядом с сайтом ГАНИН ГРУПП: тот на 127.0.0.1:8001, этот — файлами.
# Ставится в /etc/nginx/sites-available/padacha, включается симлинком.
server {
    server_name padacha.ru www.padacha.ru;

    root /opt/padacha;
    index index.html;

    # SEO: один адрес на страницу. www и /index.html — дубли, склеиваем 301.
    # $request_uri — исходный адрес: внутренний переход index -> /index.html
    # сюда не попадает, петли нет.
    if ($host = www.padacha.ru) {
        return 301 https://padacha.ru$request_uri;
    }
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /;
    }

    # Несуществующий адрес — настоящая 404 со страницей сайта.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Картинки и видео меняются редко — пусть браузер держит неделю.
    location ~* \.(webp|jpe?g|png|gif|ico|svg|mp4|woff2?)$ {
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1000;

    # Ассистент — отдельный процесс на 127.0.0.1:8100 (см. deploy/assistant.service).
    # Внешний путь /api/assistant/ХХХ -> внутренний /api/ХХХ у сервиса.
    # Объявлен раньше запретов, чтобы префикс /api/ не задело.
    location /api/assistant/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Репозиторий = веб-корень, поэтому наружу отдаём только сам лэндинг.
    # Исходники ассистента лежат здесь ради деплоя (git pull), но это не контент:
    # без запрета отдавались бы файлами — app/prompt.py, deploy/*.service и т.п.
    location ^~ /assistant/ {
        deny all;
        return 404;
    }

    # Внутренние материалы (маркетинг, семантика) — в git их нет, но если
    # окажутся в папке руками, наружу они всё равно не уйдут.
    location ^~ /direct/ {
        deny all;
        return 404;
    }

    # Служебные форматы: документация, код, юниты systemd, конфиги, примеры .env.
    location ~* \.(md|py|pyc|service|conf|example|ini|yml|yaml|sh)$ {
        deny all;
        return 404;
    }

    # Служебное репозитория наружу не отдаём.
    location ~ /\.(git|gitignore) {
        deny all;
        return 404;
    }

    # Пульт «Падачи» убран 29.10.2026: клиенты, подписки и лицензии ведутся
    # в hub (hub.padacha.ru/admin/). Старые адреса — 404.
    location ^~ /pult/ {
        return 404;
    }
    location ^~ /pult-static/ {
        return 404;
    }

    # Страница есть — отдаём, нет — 404 (раньше отдавалась главная с кодом 200).
    location / {
        try_files $uri $uri/ =404;
        # Не кэшируем html: правка текста должна доезжать сразу.
        add_header Cache-Control "no-cache";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/padacha.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/padacha.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.padacha.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = padacha.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name padacha.ru www.padacha.ru;
    return 404; # managed by Certbot




}
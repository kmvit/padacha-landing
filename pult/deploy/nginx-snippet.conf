    # Пульт «Падачи» — отдельный Django-процесс на 127.0.0.1:8110
    # (см. deploy/pult.service). Наружу — только админка и лицензии.
    location /pult/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/license/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # статика админки (collectstatic кладёт сюда при старте юнита)
    location /pult-static/ {
        alias /opt/padacha/pult/staticfiles/;
        access_log off;
        expires 30d;
    }
